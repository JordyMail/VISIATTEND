version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visiattend-api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: VISIATTEND_DB
      DB_USER: sa
      DB_PASSWORD: TempPass!2026
      JWT_SECRET: super-secret-jwt-key-change-this-in-production
      JWT_ACCESS_EXPIRY: 12h
      JWT_REFRESH_EXPIRY: 7d
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - visiattend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./server:/app/server
      - node_modules:/app/node_modules
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: visiattend-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: TempPass!2026
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./server/db/schema.sql:/schema.sql
    networks:
      - visiattend-network
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "TempPass!2026",
          "-C",
          "-Q",
          "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  visiattend-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  node_modules:
    driver: local
